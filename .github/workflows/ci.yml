name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Alembic migration chain (empty DB)
        env:
          DATABASE_URL: "sqlite:///./test_migration_ci.sqlite3"
        run: |
          alembic upgrade head
          echo "Migration chain validated: all migrations applied successfully."

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Basic import check
        run: python -c "from app.main import app; print('App imported OK')"
